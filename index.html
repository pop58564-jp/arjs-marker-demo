<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>かわいい猫のAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  vr-mode-ui="enabled: false">

  <a-marker type="pattern" url="mymarker.patt">

    <!-- 猫の体 -->
    <a-sphere
      position="0 0.55 0"
      radius="0.35"
      color="#FFF0D5"
      scale="1 1.2 0.85">
    </a-sphere>

    <!-- 猫の顔 -->
    <a-sphere
      position="0 1.15 0"
      radius="0.38"
      color="#FFF0D5">
    </a-sphere>

    <!-- 頭の模様 -->
    <a-sphere
      position="0.22 1.34 0.22"
      radius="0.17"
      color="#F5A34A"
      scale="1 1 0.25">
    </a-sphere>

    <!-- 左耳 -->
    <a-cone
      position="-0.25 1.53 0"
      radius-bottom="0.13"
      radius-top="0"
      height="0.3"
      color="#F5A34A">
    </a-cone>

    <!-- 右耳 -->
    <a-cone
      position="0.25 1.53 0"
      radius-bottom="0.13"
      radius-top="0"
      height="0.3"
      color="#F5A34A">
    </a-cone>

    <!-- 耳の内側 -->
    <a-cone
      position="-0.25 1.54 0.07"
      radius-bottom="0.07"
      radius-top="0"
      height="0.18"
      color="#F5A6A6">
    </a-cone>

    <a-cone
      position="0.25 1.54 0.07"
      radius-bottom="0.07"
      radius-top="0"
      height="0.18"
      color="#F5A6A6">
    </a-cone>

    <!-- 左目 -->
    <a-sphere
      position="-0.14 1.2 0.34"
      radius="0.055"
      color="#332222">
    </a-sphere>

    <!-- 右目 -->
    <a-sphere
      position="0.14 1.2 0.34"
      radius="0.055"
      color="#332222">
    </a-sphere>

    <!-- 鼻 -->
    <a-sphere
      position="0 1.1 0.37"
      radius="0.035"
      color="#F28B9B">
    </a-sphere>

    <!-- 口 -->
    <a-sphere
      position="-0.035 1.05 0.36"
      radius="0.018"
      color="#553333">
    </a-sphere>

    <a-sphere
      position="0.035 1.05 0.36"
      radius="0.018"
      color="#553333">
    </a-sphere>

    <!-- しっぽ -->
    <a-torus
      position="0.35 0.65 -0.05"
      radius="0.18"
      radius-tubular="0.045"
      color="#F5A34A"
      rotation="0 0 0">
    </a-torus>

    <!-- 鈴 -->
    <a-sphere
      position="0 0.85 0.32"
      radius="0.07"
      color="#FFD700">
    </a-sphere>

    <!-- 前足 -->
    <a-sphere
      position="-0.17 0.25 0.18"
      radius="0.13"
      color="#FFF0D5">
    </a-sphere>

    <a-sphere
      position="0.17 0.25 0.18"
      radius="0.13"
      color="#FFF0D5">
    </a-sphere>

    <!-- くるくる回転 -->
    <a-entity
      animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
